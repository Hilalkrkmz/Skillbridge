<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Jobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">SkillBridge</a>
        <div>
            <a href="/jobs" class="btn btn-success me-2">Jobs</a>

            <a sec:authorize="hasRole('EMPLOYER')"
               href="/job-create" class="btn btn-primary me-2">Post Job</a>

            <a sec:authorize="hasRole('APPLICANT')"
               href="/applications" class="btn btn-info me-2">My Applications</a>

            <a href="/profile" class="btn btn-warning me-2">My Profile</a>

            <a sec:authorize="hasRole('EMPLOYER')"
               href="/applications" class="btn btn-info me-2">Applications</a>

            <span sec:authorize="isAnonymous()">
                <a href="/login" class="btn btn-outline-light me-2">Login</a>
                <a href="/register" class="btn btn-primary">Register</a>
            </span>

            <span sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button class="btn btn-outline-light">Logout</button>
                </form>
            </span>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <h2>Job Posts</h2>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Salary</th>
            <th>Type</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="job : ${jobs}">
            <td th:text="${job.title}"></td>
            <td th:text="${job.description}"></td>
            <td th:text="${job.salary}"></td>
            <td th:text="${job.jobType}"></td>
            <td>
                <a sec:authorize="hasRole('EMPLOYER')"
                   th:href="@{/jobs/delete/{id}(id=${job.id})}"
                   class="btn btn-danger btn-sm">Delete</a>

                <a sec:authorize="hasRole('APPLICANT')"
                   th:href="@{/applications/apply/{id}(id=${job.id})}"
                   class="btn btn-success btn-sm">Apply</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/">
            SkillBridge
        </a>

        <div>

            <a href="/jobs" class="btn btn-success me-2">
                Jobs
            </a>

            <a sec:authorize="hasRole('EMPLOYER')"
               href="/job-create" class="btn btn-primary me-2">
                Post Job
            </a>

            <a sec:authorize="hasRole('APPLICANT')"
               href="/applications" class="btn btn-info me-2">
                My Applications
            </a>

            <a href="/profile" class="btn btn-warning me-2">
                My Profile
            </a>

            <a sec:authorize="hasRole('EMPLOYER')"
               href="/applications" class="btn btn-info me-2">Applications</a>

            <span sec:authorize="isAnonymous()">
                <a href="/login" class="btn btn-outline-light me-2">Login</a>
                <a href="/register" class="btn btn-primary">Register</a>
            </span>

            <span sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button class="btn btn-outline-light">Logout</button>
                </form>
            </span>

        </div>

    </div>
</nav>

<div class="container text-center mt-5">

    <h1>Find Freelance Jobs & Internships</h1>

    <p class="lead">
        Connect employers and applicants in one platform.
    </p>

    <span sec:authorize="isAnonymous()">
        <a href="/register" class="btn btn-primary btn-lg">
            Get Started
        </a>
    </span>

</div>

<div class="container mt-5">

    <div class="row">

        <div class="col-md-4">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h2 th:text="${userCount}">0</h2>
                    <p>Total Users</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h2 th:text="${jobCount}">0</h2>
                    <p>Total Jobs</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h2 th:text="${applicationCount}">0</h2>
                    <p>Total Applications</p>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <title>Applications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">SkillBridge</a>
        <div>
            <a href="/jobs" class="btn btn-success me-2">Jobs</a>

            <a sec:authorize="hasRole('EMPLOYER')"
               href="/job-create" class="btn btn-primary me-2">Post Job</a>

            <a sec:authorize="hasRole('EMPLOYER')"
               href="/applications" class="btn btn-info me-2">Applications</a>

            <a sec:authorize="hasRole('APPLICANT')"
               href="/applications" class="btn btn-info me-2">My Applications</a>

            <a href="/profile" class="btn btn-warning me-2">My Profile</a>

            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <h2 sec:authorize="hasRole('APPLICANT')">My Applications</h2>
    <h2 sec:authorize="hasRole('EMPLOYER')">Applications to My Jobs</h2>

    <div th:if="${applications.empty}" class="alert alert-info">
        No applications yet.
    </div>

    <table th:if="${!applications.empty}" class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Job Title</th>
            <th sec:authorize="hasRole('EMPLOYER')">Applicant</th>
            <th>Status</th>
            <th>Date</th>
            <th sec:authorize="hasRole('EMPLOYER')">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="app : ${applications}">
            <td th:text="${app.id}"></td>
            <td th:text="${app.jobPost?.title ?: '-'}"></td>

            <td sec:authorize="hasRole('EMPLOYER')"
                th:text="${app.user?.username ?: '-'}"></td>

            <td>
                <span th:text="${app.status}" class="badge bg-secondary"></span>
            </td>

            <td th:text="${#temporals.format(app.applicationDate, 'dd/MM/yyyy HH:mm')}"></td>

            <td sec:authorize="hasRole('EMPLOYER')">
                <a th:href="@{/applications/{id}/approve(id=${app.id})}"
                   class="btn btn-success btn-sm">Approve</a>
                <a th:href="@{/applications/{id}/reject(id=${app.id})}"
                   class="btn btn-danger btn-sm">Reject</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
